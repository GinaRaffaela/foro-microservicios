server:
  port: ${USERS_PORT:8081}
spring:
  application:
    name: users-service
  datasource:
    url: ${USERS_DB_URL:jdbc:oracle:thin:@localhost:1521/XEPDB1}
    username: ${USERS_DB_USERNAME:FORO_USERS}
    password: ${USERS_DB_PASSWORD:user2026}
    driver-class-name: oracle.jdbc.OracleDriver
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  jackson:
    deserialization:
      fail-on-unknown-properties: true
security:
  jwt:
    secret: ${JWT_SECRET}
logging:
  level:
    root: INFO
    cl.duoc.foro: INFO